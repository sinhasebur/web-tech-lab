<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <header class="site-header">
        <span>My Profile</span>
        <button id="logout" class="quiet" type="button" hidden>Log out</button>
    </header>

    <main>
        <h1 id="page-title" tabindex="-1">Log in</h1>
        <div class="workspace">
            <p id="message" role="status">Loading…</p>

            <section id="account-panel" aria-labelledby="page-title" hidden>
                <form id="account-form" method="post" action="/login">
                    <label for="username">Username</label>
                    <input id="username" name="username" autocomplete="username" required maxlength="50"
                           pattern="[a-zA-Z0-9_]+" aria-describedby="username-hint">
                    <small id="username-hint" hidden>Use letters, numbers, and underscores.</small>

                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password"
                           required maxlength="128" aria-describedby="password-hint">
                    <small id="password-hint" hidden>Use at least 8 characters.</small>

                    <button id="account-submit" type="submit">Log in</button>
                </form>
                <button id="switch-mode" class="quiet" type="button">Create an account</button>
            </section>

            <section id="profile-panel" aria-labelledby="page-title" hidden>
                <div id="profile-empty">
                    <p>Add a phone number and address to your profile.</p>
                    <button id="add-profile" type="button">Add details</button>
                </div>

                <div id="profile-view" hidden>
                    <dl>
                        <dt>Phone number</dt>
                        <dd id="saved-phone"></dd>
                        <dt>Address</dt>
                        <dd id="saved-address"></dd>
                    </dl>
                    <div class="actions">
                        <button id="edit-profile" type="button">Edit details</button>
                        <button id="delete-profile" class="quiet" type="button">Delete details</button>
                    </div>
                </div>

                <form id="profile-form" method="post" action="/profile" hidden>
                    <label for="phone-number">Phone number</label>
                    <input id="phone-number" name="phoneNumber" type="tel" autocomplete="tel"
                           required maxlength="30">

                    <label for="address">Address</label>
                    <textarea id="address" name="address" autocomplete="street-address" rows="3"
                              required maxlength="200"></textarea>

                    <div class="actions">
                        <button type="submit">Save details</button>
                        <button id="cancel-edit" class="quiet" type="button">Cancel</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
